<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Da capo!</title>
<meta name="description" content="Da capo! – ein Opern-Roguelike. Stell den Spielplan zusammen, bring das Haus zum Toben, und dann: noch einmal von vorn.">
<meta name="theme-color" content="#1a070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Da capo!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600;1,700;1,900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="titel" class="screen" hidden></section>
  <section id="neu" class="screen" hidden></section>
  <main id="spiel" class="screen" hidden>
    <aside id="hud"></aside>
    <section id="buehne">
      <div id="ensemble">
        <div id="stars" class="stars"></div>
        <div id="proben" class="proben"></div>
      </div>
      <div id="mitte"></div>
      <div id="handbereich">
        <div id="hand"></div>
        <div id="aktionen"></div>
      </div>
    </section>
  </main>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-akt="sheetZu"></div>
  <div class="sheet-box" role="dialog" aria-modal="true"></div>
</div>
<div id="banner" class="banner" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="vorhangL" class="vorhang vorhang-l"></div>
<div id="vorhangR" class="vorhang vorhang-r"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script type="module" src="js/main.js"></script>
</body>
</html>
